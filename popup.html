<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Smart Privacy Shield</title>
  </head>
  <body style="font-family: system-ui, -apple-system, sans-serif; padding: 16px; width: 320px; background: #f9fafc; color: #202124;">

    <h2 style="text-align:center; color:#1a73e8; margin-bottom:10px;">🛡️ Smart Privacy Shield</h2>

    <!-- Scan Section -->
    <div style="background:white; border-radius:10px; padding:12px; box-shadow:0 2px 6px rgba(0,0,0,0.08);">
      <h4 style="margin:6px 0 10px; color:#1a73e8;">Screen-Share Privacy Check</h4>
      <button id="scanTabs" 
        style="padding:8px 14px; border:none; border-radius:6px; background:#1a73e8; color:#fff; font-weight:600; cursor:pointer; width:100%;">
        🔍 Scan Tabs
      </button>
      <div id="tabsResult" style="margin-top:10px; font-size:14px; line-height:1.5;"></div>
    </div>

    <hr style="margin:20px 0; border:none; border-top:1px solid #e0e0e0;">

    <!-- Interview Analyzer -->
    <div style="background:white; border-radius:10px; padding:12px; box-shadow:0 2px 6px rgba(0,0,0,0.08);">
      <h4 style="margin:6px 0 10px; color:#1a73e8;">🎙️ Interview Analyzer</h4>
      <button id="toggleRecord" 
        style="padding:8px 14px; border:none; border-radius:6px; background:#34a853; color:white; font-weight:600; cursor:pointer; width:100%;">
        🎤 Start Recording
      </button>
      <p id="speechStatus" style="font-size:14px; color:#5f6368; margin-top:10px;"></p>
      <pre id="speechSummary" style="background:#f1f3f4; padding:8px; border-radius:6px; font-size:13px; overflow-x:auto;"></pre>
      <pre id="speechSuggestions" style="background:#f1f3f4; padding:8px; border-radius:6px; font-size:13px; overflow-x:auto;"></pre>
    </div>

    <p style="text-align:center; font-size:12px; color:#999; margin-top:10px;">Built with ❤️ using Gemini Nano</p>

    <script src="popup.js"></script>
  </body>
</html>
